<svg xmlns="http://www.w3.org/2000/svg" fill="#212529" viewBox="0 0 920 380" width="920" height="380" role="img" aria-labelledby="t d">
  <title id="t">.NET data access tools from most control to most convenience</title>
  <desc id="d">ADO.NET, Dapper, EF Core and EF6 placed on a spectrum. ADO.NET gives the most control and speed, EF gives the most convenience. All of them use ADO.NET underneath.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #495057; }
    .end { font-size: 12.5px; font-weight: 700; }
    .name { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .line { font-size: 12.5px; fill: #343A40; }
    .key { font-size: 12.5px; font-weight: 700; fill: #343A40; }
    .meter { font-size: 11.5px; fill: #6C757D; }
  </style>
  <defs>
    <linearGradient id="spec" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0C8599"/>
      <stop offset="1" stop-color="#512BD4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="918" height="378" rx="16" fill="#FFFFFF" stroke="#DEE2E6"/>
  <text x="24" y="40" class="title">Pick your data access tool</text>
  <text x="24" y="62" class="sub">Moving right, you write less code and get more features, but you give up some control and speed.</text>

  <text x="30" y="92" class="end" style="fill:#0B7285">◀ more control, more speed</text>
  <text x="890" y="92" class="end" style="fill:#5F3DC4" text-anchor="end">more convenience, less code ▶</text>
  <rect x="30" y="100" width="860" height="10" rx="5" fill="url(#spec)"/>

  <!-- cards: x = 30 + i*220, width 200 -->
  <g>
    <rect x="30" y="128" width="200" height="190" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
    <rect x="30" y="128" width="200" height="40" rx="12" fill="#0C8599"/><rect x="30" y="150" width="200" height="18" fill="#0C8599"/>
    <text x="46" y="155" class="name">ADO.NET</text>
    <text x="46" y="192" class="line"><tspan class="key">You write: </tspan>SQL + mapping</text>
    <text x="46" y="214" class="line">The foundation of all</text>
    <text x="46" y="232" class="line">the others</text>
    <text x="46" y="256" class="line"><tspan class="key">Use: </tspan>bulk work, edge cases</text>
    <text x="46" y="296" class="meter">speed</text>
    <g fill="#0C8599"><circle cx="96" cy="292" r="5"/><circle cx="110" cy="292" r="5"/><circle cx="124" cy="292" r="5"/><circle cx="138" cy="292" r="5"/></g>
  </g>
  <g>
    <rect x="250" y="128" width="200" height="190" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
    <rect x="250" y="128" width="200" height="40" rx="12" fill="#1971C2"/><rect x="250" y="150" width="200" height="18" fill="#1971C2"/>
    <text x="266" y="155" class="name">Dapper</text>
    <text x="266" y="192" class="line"><tspan class="key">You write: </tspan>SQL</text>
    <text x="266" y="214" class="line">Rows mapped to objects</text>
    <text x="266" y="232" class="line">for you</text>
    <text x="266" y="256" class="line"><tspan class="key">Use: </tspan>reports, hot reads</text>
    <text x="266" y="296" class="meter">speed</text>
    <g fill="#1971C2"><circle cx="316" cy="292" r="5"/><circle cx="330" cy="292" r="5"/><circle cx="344" cy="292" r="5"/><circle cx="358" cy="292" r="5"/></g>
  </g>
  <g>
    <rect x="470" y="128" width="200" height="190" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
    <rect x="470" y="128" width="200" height="40" rx="12" fill="#512BD4"/><rect x="470" y="150" width="200" height="18" fill="#512BD4"/>
    <text x="486" y="155" class="name">EF Core</text>
    <text x="486" y="192" class="line"><tspan class="key">You write: </tspan>LINQ (or SQL)</text>
    <text x="486" y="214" class="line">Change tracking,</text>
    <text x="486" y="232" class="line">migrations, providers</text>
    <text x="486" y="256" class="line"><tspan class="key">Use: </tspan>most new apps</text>
    <text x="486" y="296" class="meter">speed</text>
    <g fill="#512BD4"><circle cx="536" cy="292" r="5"/><circle cx="550" cy="292" r="5"/><circle cx="564" cy="292" r="5"/></g>
    <circle cx="578" cy="292" r="5" fill="#FFFFFF" stroke="#ADB5BD"/>
  </g>
  <g>
    <rect x="690" y="128" width="200" height="190" rx="12" fill="#F8F9FA" stroke="#DEE2E6"/>
    <rect x="690" y="128" width="200" height="40" rx="12" fill="#868E96"/><rect x="690" y="150" width="200" height="18" fill="#868E96"/>
    <text x="706" y="155" class="name">EF6 (legacy)</text>
    <text x="706" y="192" class="line"><tspan class="key">You write: </tspan>LINQ</text>
    <text x="706" y="214" class="line">EDMX, lazy loading</text>
    <text x="706" y="232" class="line">on by default</text>
    <text x="706" y="256" class="line"><tspan class="key">Use: </tspan>existing 4.x apps</text>
    <text x="706" y="296" class="meter">speed</text>
    <g fill="#868E96"><circle cx="756" cy="292" r="5"/><circle cx="770" cy="292" r="5"/></g>
    <circle cx="784" cy="292" r="5" fill="#FFFFFF" stroke="#ADB5BD"/><circle cx="798" cy="292" r="5" fill="#FFFFFF" stroke="#ADB5BD"/>
  </g>

  <text x="30" y="352" class="sub">Common mix: EF Core for writes and most reads, Dapper (or EF raw SQL) for the few queries that must be as fast as possible.</text>
</svg>
