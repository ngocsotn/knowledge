<svg xmlns="http://www.w3.org/2000/svg" fill="#212529" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
  <title id="t">What await does to a thread</title>
  <desc id="d">With blocking code, a thread is held for the whole database call. With async and await, the thread is released during the call and serves other requests.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #495057; }
    .h { font-size: 15px; font-weight: 700; }
    .row { font-size: 12.5px; fill: #495057; }
    .in { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
    .in-dark { font-size: 12px; font-weight: 600; fill: #2B8A3E; }
    .note { font-size: 12.5px; font-weight: 600; }
    .axis { font-size: 11.5px; fill: #868E96; }
  </style>
  <defs>
    <pattern id="free" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EBFBEE"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B2F2BB" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="378" rx="16" fill="#FFFFFF" stroke="#DEE2E6"/>
  <text x="24" y="40" class="title">What "await" does to a thread</text>
  <text x="24" y="62" class="sub">The same request: run some code, call the database (100 ms), then finish. Watch what the thread does while waiting.</text>

  <!-- Blocking -->
  <text x="24" y="102" class="h" fill="#C92A2A">Blocking: .Result, .Wait(), sync I/O</text>
  <text x="24" y="138" class="row">Thread 1</text>
  <rect x="120" y="120" width="40" height="28" rx="5" fill="#2F9E44"/>
  <rect x="160" y="120" width="500" height="28" fill="#FA5252"/>
  <text x="410" y="139" class="in" text-anchor="middle">BLOCKED: holding the thread, doing nothing</text>
  <rect x="660" y="120" width="40" height="28" rx="5" fill="#2F9E44"/>
  <text x="720" y="132" class="note" fill="#C92A2A">1 request = 1 thread</text>
  <text x="720" y="149" class="row">for the full 100 ms</text>

  <!-- Async -->
  <text x="24" y="196" class="h" fill="#2B8A3E">Async: await the database call</text>
  <text x="24" y="232" class="row">Thread 1</text>
  <rect x="120" y="214" width="40" height="28" rx="5" fill="#2F9E44"/>
  <rect x="160" y="214" width="500" height="28" fill="url(#free)"/>
  <rect x="190" y="219" width="70" height="18" rx="4" fill="#74C0FC"/><text x="225" y="232" class="in" text-anchor="middle">req B</text>
  <rect x="300" y="219" width="90" height="18" rx="4" fill="#74C0FC"/><text x="345" y="232" class="in" text-anchor="middle">req C</text>
  <rect x="430" y="219" width="60" height="18" rx="4" fill="#74C0FC"/><text x="460" y="232" class="in" text-anchor="middle">req D</text>
  <text x="575" y="232" class="in-dark" text-anchor="middle">free</text>
  <rect x="660" y="214" width="40" height="28" rx="5" fill="#2F9E44"/>
  <text x="720" y="226" class="note" fill="#2B8A3E">Thread is busy only</text>
  <text x="720" y="243" class="row">while code really runs</text>

  <text x="24" y="276" class="row">Database / OS</text>
  <rect x="160" y="260" width="500" height="22" rx="5" fill="#E9ECEF"/>
  <text x="410" y="276" class="row" text-anchor="middle">I/O in progress: no thread is waiting for it</text>
  <path d="M660,271 C680,271 670,248 676,244" fill="none" stroke="#495057" stroke-width="1.5"/>
  <text x="720" y="276" class="row">"done!" resumes the method</text>

  <!-- axis -->
  <line x1="120" y1="306" x2="700" y2="306" stroke="#ADB5BD"/>
  <g class="axis" text-anchor="middle">
    <text x="120" y="322">0 ms</text><text x="160" y="322">5</text><text x="410" y="322">time</text><text x="660" y="322">105</text><text x="700" y="322">110 ms</text>
  </g>

  <!-- legend -->
  <rect x="120" y="344" width="16" height="12" rx="2" fill="#2F9E44"/><text x="142" y="354" class="row">running your code</text>
  <rect x="280" y="344" width="16" height="12" rx="2" fill="#FA5252"/><text x="302" y="354" class="row">blocked thread</text>
  <rect x="420" y="344" width="16" height="12" rx="2" fill="url(#free)"/><text x="442" y="354" class="row">thread back in the pool</text>
  <rect x="610" y="344" width="16" height="12" rx="2" fill="#74C0FC"/><text x="632" y="354" class="row">other requests using it</text>
</svg>
