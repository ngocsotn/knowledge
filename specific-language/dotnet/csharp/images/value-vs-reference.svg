<svg xmlns="http://www.w3.org/2000/svg" fill="#212529" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
  <title id="t">Value types vs reference types</title>
  <desc id="d">Assigning a struct copies the data, so changing the copy leaves the original alone. Assigning a class copies the reference, so both variables see the change.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #495057; }
    .h { font-size: 16px; font-weight: 700; }
    .code { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #343A40; }
    .lbl { font-size: 12px; fill: #868E96; font-weight: 600; letter-spacing: 1px; }
    .var { font-family: Consolas, "Courier New", monospace; font-size: 14px; font-weight: 700; }
    .val { font-family: Consolas, "Courier New", monospace; font-size: 14px; }
    .res { font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C7ED6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="358" rx="16" fill="#FFFFFF" stroke="#DEE2E6"/>
  <text x="24" y="40" class="title">Copy the data, or copy the address?</text>
  <text x="24" y="62" class="sub">The real difference between value types and reference types is what "=" copies.</text>

  <!-- Left panel: struct -->
  <rect x="24" y="80" width="410" height="256" rx="12" fill="#F3F0FF" stroke="#D0BFFF"/>
  <text x="44" y="108" class="h" fill="#5F3DC4">struct (value type)</text>
  <rect x="44" y="120" width="370" height="54" rx="8" fill="#FFFFFF" stroke="#E9ECEF"/>
  <text x="58" y="142" class="code">var a = new PointStruct { X = 1 };</text>
  <text x="58" y="162" class="code">var b = a;   b.X = 99;</text>

  <text x="44" y="200" class="lbl">EACH VARIABLE HOLDS ITS OWN COPY</text>
  <rect x="64" y="214" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#9775FA" stroke-width="2"/>
  <text x="80" y="238" class="var">a</text><text x="80" y="258" class="val">{ X = 1 }</text>
  <rect x="244" y="214" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#9775FA" stroke-width="2"/>
  <text x="260" y="238" class="var">b</text><text x="260" y="258" class="val">{ X = 99 }</text>
  <text x="44" y="306" class="res" fill="#2B8A3E">a.X is still 1. The copy is independent.</text>
  <text x="44" y="324" class="sub">int, bool, DateTime, enum, struct, record struct</text>

  <!-- Right panel: class -->
  <rect x="466" y="80" width="410" height="256" rx="12" fill="#E7F5FF" stroke="#A5D8FF"/>
  <text x="486" y="108" class="h" fill="#1864AB">class (reference type)</text>
  <rect x="486" y="120" width="370" height="54" rx="8" fill="#FFFFFF" stroke="#E9ECEF"/>
  <text x="500" y="142" class="code">var c = new PointClass { X = 1 };</text>
  <text x="500" y="162" class="code">var d = c;   d.X = 99;</text>

  <text x="486" y="200" class="lbl">STACK</text>
  <text x="706" y="200" class="lbl">HEAP</text>
  <rect x="486" y="212" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#4DABF7" stroke-width="2"/>
  <text x="500" y="232" class="var">c</text><text x="525" y="232" class="val">ref</text>
  <rect x="486" y="250" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#4DABF7" stroke-width="2"/>
  <text x="500" y="270" class="var">d</text><text x="525" y="270" class="val">ref</text>
  <rect x="706" y="220" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#1C7ED6" stroke-width="2"/>
  <text x="720" y="244" class="lbl">ONE OBJECT</text><text x="720" y="264" class="val">{ X = 99 }</text>
  <line x1="596" y1="227" x2="702" y2="240" stroke="#1C7ED6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="596" y1="265" x2="702" y2="256" stroke="#1C7ED6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="486" y="306" class="res" fill="#C92A2A">c.X is now 99 too. Both point to one object.</text>
  <text x="486" y="324" class="sub">string, arrays, class, record, delegates</text>
</svg>
