<svg xmlns="http://www.w3.org/2000/svg" fill="#212529" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">The .NET family timeline</title>
  <desc id="d">Four lanes from 2002 to 2026: .NET Framework, Mono and Xamarin, .NET Core, and .NET 5 and later, with key versions marked.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #495057; }
    .lane { font-size: 14px; font-weight: 700; }
    .lane-note { font-size: 11px; fill: #6c757d; }
    .mk { font-size: 11.5px; font-weight: 600; }
    .bar-text { font-size: 12px; font-weight: 600; fill: #ffffff; }
    .axis { font-size: 12px; fill: #6c757d; }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#D0EBFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#74C0FC" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#512BD4"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="398" rx="16" fill="#FFFFFF" stroke="#DEE2E6"/>
  <text x="24" y="40" class="title">The .NET family at a glance</text>
  <text x="24" y="62" class="sub">".NET 4.5" and ".NET 8" are different runtimes. Modern .NET grew out of .NET Core, not out of .NET Framework.</text>

  <!-- grid lines -->
  <g stroke="#F1F3F5" stroke-width="1">
    <line x1="170" y1="85" x2="170" y2="345"/>
    <line x1="295" y1="85" x2="295" y2="345"/>
    <line x1="420" y1="85" x2="420" y2="345"/>
    <line x1="545" y1="85" x2="545" y2="345"/>
    <line x1="670" y1="85" x2="670" y2="345"/>
    <line x1="795" y1="85" x2="795" y2="345"/>
    <line x1="920" y1="85" x2="920" y2="345"/>
  </g>

  <!-- lane labels -->
  <text x="24" y="124" class="lane">.NET Framework</text>
  <text x="24" y="140" class="lane-note">Windows only</text>
  <text x="24" y="189" class="lane">Mono / Xamarin</text>
  <text x="24" y="205" class="lane-note">open-source copy</text>
  <text x="24" y="254" class="lane">.NET Core</text>
  <text x="24" y="270" class="lane-note">the rewrite</text>
  <text x="24" y="319" class="lane">.NET 5 and later</text>
  <text x="24" y="335" class="lane-note">"one .NET"</text>

  <!-- .NET Framework lane -->
  <rect x="170" y="115" width="531" height="26" rx="6" fill="#1C7ED6"/>
  <rect x="701" y="115" width="219" height="26" rx="6" fill="url(#hatch)"/>
  <text x="182" y="133" class="bar-text">1.0 to 4.8: System.Web, Web Forms, WCF, WinForms, WPF</text>
  <text x="712" y="133" class="mk" fill="#1864AB">maintenance only (4.8.1)</text>
  <circle cx="482" cy="115" r="6" fill="#FFFFFF" stroke="#1864AB" stroke-width="3"/>
  <text x="482" y="104" class="mk" text-anchor="middle">4.5 (2012): async/await</text>
  <circle cx="701" cy="115" r="6" fill="#FFFFFF" stroke="#1864AB" stroke-width="3"/>
  <text x="701" y="104" class="mk" text-anchor="middle">4.8 (2019): last big release</text>

  <!-- Mono lane -->
  <rect x="232" y="180" width="500" height="26" rx="6" fill="#0C8599"/>
  <text x="244" y="198" class="bar-text">Linux, macOS, Android, iOS, Unity</text>
  <text x="742" y="198" class="mk" fill="#0B7285">mobile moved into .NET MAUI</text>

  <!-- .NET Core lane -->
  <rect x="607" y="245" width="125" height="26" rx="6" fill="#9775FA"/>
  <text x="619" y="263" class="bar-text">1.0 to 3.1</text>
  <circle cx="607" cy="245" r="6" fill="#FFFFFF" stroke="#7048E8" stroke-width="3"/>
  <text x="590" y="236" class="mk" text-anchor="end">Core 1.0 (2016)</text>
  <path d="M732,258 C760,258 750,310 770,310" fill="none" stroke="#512BD4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- .NET 5+ lane -->
  <rect x="732" y="310" width="188" height="26" rx="6" fill="#512BD4"/>
  <g>
    <circle cx="732" cy="310" r="6" fill="#FFFFFF" stroke="#512BD4" stroke-width="3"/>
    <text x="732" y="300" class="mk" text-anchor="middle">5</text>
    <circle cx="764" cy="310" r="6" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
    <text x="764" y="300" class="mk" text-anchor="middle">6</text>
    <circle cx="826" cy="310" r="6" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
    <text x="826" y="300" class="mk" text-anchor="middle">8</text>
    <circle cx="889" cy="310" r="6" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
    <text x="889" y="300" class="mk" text-anchor="middle">10</text>
  </g>
  <text x="826" y="328" class="bar-text" text-anchor="middle">yearly, every Nov</text>

  <!-- axis -->
  <line x1="170" y1="352" x2="920" y2="352" stroke="#ADB5BD"/>
  <g class="axis" text-anchor="middle">
    <text x="170" y="370">2002</text>
    <text x="295" y="370">2006</text>
    <text x="420" y="370">2010</text>
    <text x="545" y="370">2014</text>
    <text x="670" y="370">2018</text>
    <text x="795" y="370">2022</text>
    <text x="920" y="370">2026</text>
  </g>

  <!-- legend -->
  <circle cx="500" cy="389" r="5" fill="#FFFFFF" stroke="#2F9E44" stroke-width="3"/>
  <text x="511" y="393" class="lane-note">green ring = LTS (3 years of support)</text>
  <rect x="720" y="383" width="16" height="12" rx="2" fill="url(#hatch)"/>
  <text x="742" y="393" class="lane-note">security fixes only</text>
</svg>
