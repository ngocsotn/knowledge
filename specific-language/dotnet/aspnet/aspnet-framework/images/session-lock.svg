<svg xmlns="http://www.w3.org/2000/svg" fill="#212529" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
  <title id="t">The classic ASP.NET session lock</title>
  <desc id="d">With read/write session, three requests from the same user run one after another, so two quick AJAX calls finish after 9 and 10 seconds. With read-only session they run in parallel and finish after 1 second.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #495057; }
    .h { font-size: 15px; font-weight: 700; }
    .row { font-size: 12.5px; fill: #495057; }
    .in { font-size: 11.5px; font-weight: 600; fill: #FFFFFF; }
    .wait { font-size: 11.5px; font-weight: 600; fill: #C92A2A; }
    .res { font-size: 13px; font-weight: 700; }
    .axis { font-size: 11.5px; fill: #868E96; }
  </style>
  <defs>
    <pattern id="waiting" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFF5F5"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#FFC9C9" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="398" rx="16" fill="#FFFFFF" stroke="#DEE2E6"/>
  <text x="24" y="40" class="title">One slow request freezes the whole page</text>
  <text x="24" y="62" class="sub">Same user, same session cookie: a slow report (8 s) plus two quick AJAX calls (1 s each) start at the same time.</text>

  <!-- scale: x = 160 + seconds * 56 -->

  <!-- Scenario A -->
  <text x="24" y="98" class="h" fill="#C92A2A">Default: read/write session (exclusive lock)</text>
  <text x="24" y="126" class="row">Report</text>
  <rect x="160" y="112" width="448" height="22" rx="5" fill="#1C7ED6"/><text x="172" y="127" class="in">holds the session lock for 8 s</text>
  <text x="24" y="156" class="row">AJAX call 1</text>
  <rect x="160" y="142" width="448" height="22" rx="5" fill="url(#waiting)"/><text x="172" y="157" class="wait">waiting for the lock...</text>
  <rect x="608" y="142" width="56" height="22" rx="5" fill="#4DABF7"/>
  <text x="24" y="186" class="row">AJAX call 2</text>
  <rect x="160" y="172" width="504" height="22" rx="5" fill="url(#waiting)"/><text x="172" y="187" class="wait">waiting for the lock...</text>
  <rect x="664" y="172" width="56" height="22" rx="5" fill="#4DABF7"/>
  <text x="736" y="166" class="res" fill="#C92A2A">AJAX done at 9 s</text>
  <text x="736" y="186" class="res" fill="#C92A2A">and 10 s</text>

  <!-- Scenario B -->
  <text x="24" y="232" class="h" fill="#2B8A3E">[SessionState(ReadOnly)] on the AJAX controller</text>
  <text x="24" y="260" class="row">Report</text>
  <rect x="160" y="246" width="448" height="22" rx="5" fill="#1C7ED6"/><text x="172" y="261" class="in">still 8 s</text>
  <text x="24" y="290" class="row">AJAX call 1</text>
  <rect x="160" y="276" width="56" height="22" rx="5" fill="#4DABF7"/>
  <text x="24" y="320" class="row">AJAX call 2</text>
  <rect x="160" y="306" width="56" height="22" rx="5" fill="#4DABF7"/>
  <text x="736" y="300" class="res" fill="#2B8A3E">AJAX done at 1 s</text>

  <!-- axis -->
  <line x1="160" y1="346" x2="720" y2="346" stroke="#ADB5BD"/>
  <g class="axis" text-anchor="middle">
    <text x="160" y="362">0 s</text><text x="272" y="362">2 s</text><text x="384" y="362">4 s</text>
    <text x="496" y="362">6 s</text><text x="608" y="362">8 s</text><text x="720" y="362">10 s</text>
  </g>
  <text x="24" y="386" class="sub">ASP.NET Core session has no lock at all, so this queueing never happens there (but concurrent writes can overwrite each other).</text>
</svg>
